name: AIAgent Stock Daily Push

on:
  schedule:
    # 每天北京时间上午 11:00 运行 (UTC时间 3:00)
    - cron: '0 3 * * 1-5' 
  workflow_dispatch: # 允许手动点击运行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install akshare pandas requests
      
      - name: Run Stock Bot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py
